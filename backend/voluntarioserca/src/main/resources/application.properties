spring.application.name=voluntarioserca

# Configuración de base de datos para Neon.tech (PostgreSQL en la nube con SSL)
# Puedes pasar las credenciales por variables de entorno o colocarlas directamente aquí
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-restless-base-b609vj1r-pooler.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_u7gnetrJNk2y}

# Optimizaciones de HikariCP para entornos serverless (Neon.tech)
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
server.port= 8089

# Origen(es) del frontend permitidos por CORS, separados por coma; admite patrones como [*] para el puerto (sobrescribible con FRONTEND_URL)
app.frontend-url=${FRONTEND_URL:http://localhost:[*],http://127.0.0.1:[*]}
